<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">Список товаров</h2>
    <span class="badge bg-secondary">Всего: {{ products().length }}</span>
  </div>

  @if (products().length > 0) {
    <!-- Сетка товаров -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      @for (p of products(); track p.id) {
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title text-truncate">{{ p.name }}</h5>
              <p class="card-text text-muted">
                {{ p.description }}
              </p>
            </div>
            
            <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center">
              <!-- Использование пайпа валюты -->
              <span class="h5 mb-0 text-success">{{ p.price | currency:'USD' }}</span>
              <button class="btn btn-primary btn-sm">Купить</button>
            </div>
          </div>
        </div>
      }
    </div>
  } @else {
    <!-- Сообщение, если список пуст -->
    <div class="alert alert-info mt-4 text-center">
      Товары не найдены или загружаются...
    </div>
  }
</div>
